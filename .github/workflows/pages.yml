name: Publicar demonstracao publica isolada
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos da demo
        shell: bash
        run: |
          set -eu
          test -f index.html
          test -f app.js
          test -f styles.css
          node --check app.js
          if grep -Ei 'workers[.]dev|/api/|fetch\(|XMLHttpRequest|WebSocket|indexedDB|localStorage|sessionStorage|database_id|D1' index.html app.js; then
            echo 'A demonstracao contem referencia proibida ao ambiente operacional'
            exit 1
          fi
          if grep -Ei '@import|url\(' styles.css; then
            echo 'Recurso de CSS externo nao permitido'
            exit 1
          fi
          mkdir -p site
          cp index.html app.js styles.css site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
